[project]
name = "sample-agent-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.0.0",
    "agent-framework-devui>=1.0.0b260311",
    "azure-cosmos>=4.9.0",
    "azure-monitor-opentelemetry>=1.8.7",
    "debugpy>=1.8.19",
    "fastmcp>=2.14.2",
    "opentelemetry-instrumentation-aiohttp-client>=0.61b0",
    "opentelemetry-instrumentation-anthropic>=0.60.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-mcp>=0.60.0",
    "ruff>=0.14.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["agent-framework/demo/src"]
testpaths = ["agent-framework/demo/tests"]

[tool.ruff.lint.per-file-ignores]
"fastmcp/demo/server.py" = ["E402"]

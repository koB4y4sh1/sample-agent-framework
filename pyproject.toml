[project]
name = "sample-agent-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a>=0.44",
    "a2a-sdk[all]>=1.0.3",
    "agent-framework>=1.9.0",
    "agent-framework-azure-contentunderstanding>=1.0.0a260618",
    "agent-framework-devui>=1.0.0b260528",
    "agent-framework-gemini>=1.0.0a260609",
    "azure-ai-contentunderstanding>=1.2.0b1",
    "azure-cosmos>=4.9.0",
    "azure-monitor-opentelemetry>=1.8.7",
    "azure-storage-blob>=12.27.1",
    "debugpy>=1.8.19",
    "fastmcp>=2.14.2",
    "nicegui>=3.13.0",
    "openai>=2.38.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.61b0",
    "opentelemetry-instrumentation-anthropic>=0.60.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-mcp>=0.60.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.14.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["agent-framework/demo/src"]
testpaths = ["agent-framework/demo/tests"]

[tool.ruff.lint.per-file-ignores]
"fastmcp/demo/server.py" = ["E402"]
